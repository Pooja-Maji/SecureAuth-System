{% extends "base.html" %}

{% block title %}Login - SecureAuth System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="auth-card p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="card-header-icon">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="text-muted small">Enter your credentials to access your dashboard</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" novalidate>
                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email" 
                            placeholder="name@example.com" 
                            value="{{ email if email else '' }}" 
                            required
                            autofocus
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                        >
                        <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">
                            <i class="bi bi-eye" id="toggleLoginPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </button>

                <!-- Link to Register -->
                <div class="text-center pt-2 border-top">
                    <p class="text-muted small mb-0">
                        Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">
                            Create Account
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Password visibility toggle helper
    const toggleBtn = document.getElementById('toggleLoginPassword');
    const inputField = document.getElementById('password');
    const icon = document.getElementById('toggleLoginPasswordIcon');

    if (toggleBtn && inputField && icon) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = inputField.getAttribute('type') === 'password';
            inputField.setAttribute('type', isPassword ? 'text' : 'password');
            icon.classList.toggle('bi-eye', !isPassword);
            icon.classList.toggle('bi-eye-slash', isPassword);
        });
    }
</script>
{% endblock %}
